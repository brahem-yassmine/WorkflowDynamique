version: '3.8'

services:
  backend:
    build:
      context: ./back
      dockerfile: Dockerfile
    container_name: workflow_backend
    ports:
      - "5000:5000"
    env_file:
      - ./back/.env
    environment:
      - NODE_ENV=production
    restart: unless-stopped

  frontend:
    build:
      context: ./front
      dockerfile: Dockerfile
    container_name: workflow_frontend
    ports:
      - "3000:3000"
    env_file:
      - ./front/.env.local
    environment:
      - NODE_ENV=production
    depends_on:
      - backend
    restart: unless-stopped
